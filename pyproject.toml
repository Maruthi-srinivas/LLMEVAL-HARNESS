[project]
name = "evalforge"
version = "1.0.0"
description = "EvalForge evaluation engine and health API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.1",
    "boto3==1.35.90",
    "argon2-cffi==23.1.0",
    "celery==5.4.0",
    "fastapi==0.115.6",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "langgraph==0.2.60",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pyjwt==2.10.1",
    "pytest==8.3.4",
    "python-multipart==0.0.20",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "uvicorn==0.34.0",
    "kafka-python==2.0.2",
    "prometheus-client==0.21.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["evaluator/tests"]
pythonpath = ["."]
