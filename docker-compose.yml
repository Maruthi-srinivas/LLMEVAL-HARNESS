x-app-build: &app-build
  context: .
  dockerfile: backend/Dockerfile

x-app-image: &app-image
  image: evalharness-app
  build: *app-build

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://evalforge:evalforge@postgres:5432/evalforge}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-evalforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-evalforge}
      POSTGRES_DB: ${POSTGRES_DB:-evalforge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evalforge} -d ${POSTGRES_DB:-evalforge}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *app-image
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    <<: *app-image
    environment: *app-env
    command: ["celery", "-A", "worker.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app-image
    environment: *app-env
    command: ["celery", "-A", "worker.celery_app", "beat", "--loglevel=info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *app-image
    environment: *app-env
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      beat:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  runner:
    profiles: ["sample"]
    <<: *app-image
    environment: *app-env
    command: ["python", "-m", "evaluator.cli", "run-sample"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
